{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Change password</h1></div></div>
<div class="card card-pad" style="max-width:460px">
  <form method="post" class="grid" style="gap:14px">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label class="field">Current password<input type="password" name="current_password" required autocomplete="current-password"></label>
    <label class="field">New password <span class="hint">At least 8 characters</span><input type="password" name="new_password" minlength="8" required autocomplete="new-password"></label>
    <label class="field">Repeat new password<input type="password" name="confirm_password" minlength="8" required autocomplete="new-password"></label>
    <div class="form-actions"><a class="btn btn-ghost" href="{{ url_for('index') }}">Cancel</a><button class="btn">Change password</button></div>
  </form>
</div>
{% endblock %}
